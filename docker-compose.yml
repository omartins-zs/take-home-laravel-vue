services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"           # expõe a porta 8000
    depends_on:
      - db
    command: >
      sh -c "
        composer install &&
        php artisan migrate &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  db:
    image: mysql:7
    environment:
      MYSQL_DATABASE: takehome
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"
    command: sh -c "npm install && npm run serve"
    depends_on:
      - backend

volumes:
  db_data:
